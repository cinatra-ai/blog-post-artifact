name: truthful-attribution-gate
# Thin caller for the org-reusable truthful-attribution-gate (cinatra-ai/ci).
# WARN mode (rollout soak): findings are annotated, the check is ALWAYS green —
# it never fails a PR. This repo commits .github/gate-suite.json, so the
# gate-suite arm IS exercised: the engine reads that suite at its default path,
# classifies a change against the central high-risk defaults EXTENDED by the
# suite's highRiskPaths (a set that drops a central default fails closed),
# applies the version-bump/audit-coupling rule whenever a PR changes the suite,
# and verifies any Gate-suite + Accountable record against it — WARN still
# annotates rather than failing. The engine is pinned by SHA below; the trailing
# version marker on the reusable-workflow call follows this repo's thin-caller
# convention, while the SHA and with.ref value are the authoritative immutable
# pin (the actions-pinned-gate format-checks the marker but does not bind it to
# the pinned SHA).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  checks: read
  # actions:read is MANDATORY: the engine resolves a reusable-workflow check-run
  # to its Actions run (GET /actions/runs/{id}) to verify referenced_workflows[]
  # at the pinned SHA. With an explicit permissions block, any omitted scope
  # defaults to `none`, and a called reusable workflow cannot exceed the caller's
  # grant — so omitting this causes startup_failure (red/missing check), which
  # WARN mode CANNOT rescue (it fails before any step runs). Do not drop this line.
  actions: read

jobs:
  truthful-attribution-gate:                 # caller job id MUST stay this exact string
    uses: cinatra-ai/ci/.github/workflows/truthful-attribution-gate.yml@8eede1022e835997d94974e4bd6205daf72131a2 # v0.1.0
    with:
      mode: warn
      ref: 8eede1022e835997d94974e4bd6205daf72131a2
